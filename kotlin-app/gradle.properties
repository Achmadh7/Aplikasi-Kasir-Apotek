# Heap Gradle 4 GB (am187): R8 release kehabisan heap di 2 GB
# (OutOfMemoryError di minifyReleaseWithR8, Run 44117210851).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Cache build Gradle: hasil task yang tidak berubah dipakai ulang antar
# build (di CI dipadukan dengan cache setup-gradle, jadi build berikutnya
# jauh lebih cepat).
org.gradle.caching=true
