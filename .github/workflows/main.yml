      - name: Checkout keystore repo
        uses: actions/checkout@v5
        with:
          repository: Achmadh7/Sigkey-Apotek-Lestari
          token: ${{ secrets.KEYSTORE_REPO_TOKEN }}
          path: keystores-private
      - name: Setup Signing Config
        run: |
          cat > kotlin-app/signing.properties << 'EOF'
          KEYSTORE_PATH=${{ github.workspace }}/keystores-private/apotek.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        working-directory: kotlin-app
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: kotlin-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
