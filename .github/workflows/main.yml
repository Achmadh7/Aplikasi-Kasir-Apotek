name: Build APK


on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
        working-directory: kotlin-app
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: kotlin-app
      - name: Checkout keystore repo
        uses: actions/checkout@v5
        with:
          repository: Achmadh7/Sigkey-Apotek-Lestari
          token: ${{ secrets.KEYSTORE_REPO_TOKEN }}
          path: keystores-private
      - name: Setup Signing Config
        run: |
          cat > kotlin-app/signing.properties << 'EOF'
          KEYSTORE_PATH=${{ github.workspace }}/keystores-private/apotek.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        working-directory: kotlin-app
            - name: Rename release APK
                    run: cp "kotlin-app/app/build/outputs/apk/release/app-release.apk" "Apotek Lestari-1.2.0-Release.apk"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Apotek Lestari-1.2.0-Release
          path: Apotek Lestari-1.2.0-Release.apk
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: kotlin-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
