name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          [ -d "$ANDROID_HOME/platforms/android-37" ] || ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
        working-directory: kotlin-app
      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        run: gradle assembleDebug --stacktrace
        working-directory: kotlin-app
      - name: Checkout keystore repo
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          repository: Achmadh7/Sigkey-Apotek-Lestari
          token: ${{ secrets.KEYSTORE_REPO_TOKEN }}
          path: keystores-private
      - name: Setup Signing Config
        if: github.event_name == 'workflow_dispatch'
        run: |
          cat > kotlin-app/signing.properties << 'EOF'
          KEYSTORE_PATH=${{ github.workspace }}/keystores-private/apotek.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
      - name: Build release APK
        if: github.event_name == 'workflow_dispatch'
        run: gradle assembleRelease --stacktrace
        working-directory: kotlin-app
      - name: Rename release APK
        id: rename_apk
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' kotlin-app/app/build.gradle.kts)
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          cp "kotlin-app/app/build/outputs/apk/release/app-release.apk" "Apotek Lestari-$VERSION-Release.apk"
      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Apotek Lestari-${{ steps.rename_apk.outputs.app_version }}-Release
          path: Apotek Lestari-${{ steps.rename_apk.outputs.app_version }}-Release.apk
          if-no-files-found: error
      - name: Upload APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: kotlin-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
