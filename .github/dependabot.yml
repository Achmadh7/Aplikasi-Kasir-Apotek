# Dependabot — Apotek Lestari
# Weekly update PRs for the Gradle dependencies (kotlin-app/) and for the
# GitHub Actions used by .github/workflows/main.yml. Review and merge the
# PRs by hand; nothing auto-merges. The CI workflow is workflow_dispatch
# only, so Dependabot PRs get no automatic checks — run the workflow by
# hand from the latest head before merging a bump.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/kotlin-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      firebase:
        patterns:
          - "com.google.firebase*"
          - "com.google.gms*"
    ignore:
      # POI 6.0.0 breaks the Android dex step (D8 nest-host error in
      # poi-ooxml-lite) — stay on 5.5.1 until a fixed 6.x release exists.
      - dependency-name: "org.apache.poi:poi-ooxml"
        versions: [">= 6.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
